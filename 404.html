<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page not found — OrqFlux</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#fff;--surface:#f5f4f0;--ink:#0d0d0b;--ink2:#52514c;--ink3:#a09d94;--border:#e4e1d8;--a1:#1c1f6e;--a1-mid:#3b40a8;--a1-light:#ecedfb;--font-head:'Instrument Serif',serif;--font-body:'Geist',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
nav{border-bottom:1px solid var(--border);height:58px;padding:0 32px;display:flex;align-items:center}
.nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-weight:600;font-size:17px;letter-spacing:-.03em}
.logo-mark{width:28px;height:28px;background:var(--a1);border-radius:7px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:16px;height:16px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round}
.body{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.inner{max-width:400px}
.code{font-size:72px;font-family:var(--font-head);font-weight:400;color:var(--a1);line-height:1;margin-bottom:16px}
.code em{font-style:italic;color:var(--a1-mid)}
h1{font-family:var(--font-head);font-size:28px;font-weight:400;margin-bottom:10px}
p{font-size:15px;color:var(--ink2);margin-bottom:28px;line-height:1.6}
a.btn{background:var(--ink);color:white;font-size:14px;font-weight:500;padding:11px 24px;border-radius:50px;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:opacity .15s}
a.btn:hover{opacity:.85}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">
    <div class="logo-mark"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="2.5"/><line x1="9" y1="1.5" x2="9" y2="6"/><line x1="9" y1="12" x2="9" y2="16.5"/><line x1="1.5" y1="9" x2="6" y2="9"/><line x1="12" y1="9" x2="16.5" y2="9"/></svg></div>
    OrqFlux
  </a>
</nav>
<div class="body">
  <div class="inner">
    <div class="code">4<em>0</em>4</div>
    <h1>Page not found.</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a href="/" class="btn">Back to home &rarr;</a>
  </div>
</div>
</body>
</html>
